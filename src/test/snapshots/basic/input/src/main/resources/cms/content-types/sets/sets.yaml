kind: "ContentType"
title: "Sets"
superType: "base:structured"
form:
  - type: "FieldSet"
    label: "Field set"
    items:
      - type: "TextLine"
        name: "fieldSetTitle"
        label: "Field set title"
        occurrences:
          min: 1
          max: 1

  - type: "ItemSet"
    name: "contact"
    label: "Contact"
    occurrences:
      min: 1
      max: 1
    items:
      - type: "TextLine"
        name: "email"
        label: "Email"

      - type: "ItemSet"
        name: "phoneNumbers"
        label: "Phone numbers"
        occurrences:
          min: 0
          max: 0
        items:
          - type: "TextLine"
            name: "number"
            label: "Number"
            occurrences:
              min: 1
              max: 1

  - type: "ItemSet"
    name: "emptyItemSet"
    label: "Empty item set"
    items: []

  - type: "OptionSet"
    name: "singleSelect"
    label: "Single select"
    occurrences:
      min: 1
      max: 1
    selection:
      min: 1
      max: 1
    options:
      - name: "none"
        label: "None"
      - name: "text"
        label: "Text"
        items:
          - type: "TextArea"
            name: "text"
            label: "Text"

  - type: "OptionSet"
    name: "multiSelect"
    label: "Multi select"
    selection:
      min: 0
      max: 0
    options:
      - name: "first"
        label: "First"
      - name: "second"
        label: "Second"
        items:
          - type: "Long"
            name: "count"
            label: "Count"

  - type: "OptionSet"
    name: "optionSetArray"
    label: "Option set array"
    occurrences:
      min: 0
      max: 0
    selection:
      min: 1
      max: 1
    options:
      - name: "nested"
        label: "Nested"
        items:
          - type: "OptionSet"
            name: "nestedOptionSet"
            label: "Nested option set"
            selection:
              min: 1
              max: 1
            options:
              - name: "a"
                label: "A"
