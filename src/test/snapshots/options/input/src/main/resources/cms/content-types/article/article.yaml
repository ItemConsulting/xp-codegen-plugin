kind: "ContentType"
title: "Article"
superType: "base:structured"
form:
  - type: "TextLine"
    name: "title"
    label: "Title"
    occurrences:
      min: 1
      max: 1

  - type: "ComboBox"
    name: "category"
    label: "Category"
    options:
      - value: "news"
        label: "News"
      - value: "sports"
        label: "Sports"

  - type: "TextLine"
    name: "my-hyphenated-field"
    label: "Hyphenated field"
